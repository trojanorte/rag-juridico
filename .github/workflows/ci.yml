name: CI
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --select E4,E7,E9,F --exclude vectorstore/versions
      - run: python -m compileall -q app.py build_index.py query.py rag_generator.py core embeddings ingest observability pages vectorstore evaluation tests
      - run: pytest tests -q
      - run: python evaluation/evaluate_retrieval.py --check-dataset
